name: Nightly release to Kidz Lounge

# At 2 AM New York time, whatever is on main (already running on Demo) goes
# to Kidz Lounge: code, then migrations. The `production` branch marks what
# Kidz Lounge is running, so a night with nothing new does nothing. The
# frontend's own release follows once this one has finished.
#
# GitHub starts scheduled runs late, often by hours (the 11 PM release ran
# at 5:51 and 6:51 AM, Nov 2026), so it checks every hour and the first check
# that actually starts between 2 and 5 AM in New York releases; the rest find
# nothing new. A check outside those hours stops straight away.
# "Run workflow" on this workflow's Actions page = release now (urgent fixes).
on:
  schedule:
    - cron: '7 * * * *' # hourly, off the top of the hour (GitHub's busiest)
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: when
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = schedule ] && { [ "$hour" -lt 2 ] || [ "$hour" -ge 5 ]; }; then
            echo "Not between 2 and 5 AM in New York; waiting."; echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'true'
        with:
          fetch-depth: 0

      - id: check
        if: steps.when.outputs.go == 'true'
        run: |
          if git rev-parse -q --verify origin/production > /dev/null && [ "$(git rev-parse origin/production)" = "$(git rev-parse HEAD)" ]; then
            echo "Nothing new since the last release."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Releasing $(git rev-parse --short HEAD) to Kidz Lounge."
          echo go=true >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.go == 'true'
    uses: ./.github/workflows/lambda-deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      role-arn: ${{ vars.AWS_ROLE_ARN }}
      function-name: ${{ vars.LAMBDA_FUNCTION_NAME }}

  # Only after a successful deploy and migration run.
  mark-released:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin "${{ github.sha }}:refs/heads/production"
